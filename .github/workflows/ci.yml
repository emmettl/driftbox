name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The browser project measures the audio through a real OfflineAudioContext, which is a
      # thing Node does not have. Chromium only, and only its own dependencies — the full
      # `playwright install` fetches three engines this repo does not test in.
      - run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      # This is the same full test run with V8 coverage collection enabled. There is no threshold:
      # the report exposes untested files and branches without pretending a percentage can judge
      # the sound or the visuals.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

      # Offline support is the one feature that cannot be tested before a build: it caches the
      # built filenames, and the worker is deliberately not registered by the dev server. So it
      # runs here, against the artifact that would be deployed, in the Chromium already installed
      # above — and it serves that artifact at /driftbox/ as well as at the root, because every
      # path involved is relative and only the subdirectory tells the two apart.
      - run: npm run verify:offline --workspace @driftbox/app

      # What each page costs to open, and the structural half of that: no scene may be in either
      # page's first-load graph. One static import in the registry welds all eighteen back into
      # the entry, and it is a change nobody would see reviewing the diff that caused it.
      - run: npm run check:size --workspace @driftbox/app

      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run

      - name: Verify offline support through Cloudflare asset routing
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/driftbox-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; cat /tmp/driftbox-wrangler.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          DRIFTBOX_VERIFY_URL=http://127.0.0.1:8787/ npm run verify:offline --workspace @driftbox/app

      - name: Release marker
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const { GITHUB_REPOSITORY: repository, GITHUB_SHA: commit, GITHUB_RUN_ID: run_id, GITHUB_SERVER_URL: server } = process.env
          writeFileSync('packages/app/dist/_release.json', JSON.stringify({
            repository, commit, run_id,
            workflow_url: `${server}/${repository}/actions/runs/${run_id}`,
          }) + '\n')
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: driftbox-site
          path: packages/app/dist
          retention-days: 3
