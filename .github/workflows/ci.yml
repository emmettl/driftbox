name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The browser project measures the audio through a real OfflineAudioContext, which is a
      # thing Node does not have. Chromium only, and only its own dependencies — the full
      # `playwright install` fetches three engines this repo does not test in.
      - run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      # This is the same full test run with V8 coverage collection enabled. There is no threshold:
      # the report exposes untested files and branches without pretending a percentage can judge
      # the sound or the visuals.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

      # Offline support is the one feature that cannot be tested before a build: it caches the
      # built filenames, and the worker is deliberately not registered by the dev server. So it
      # runs here, against the artifact that would be deployed, in the Chromium already installed
      # above — and it serves that artifact at /driftbox/ as well as at the root, because every
      # path involved is relative and only the subdirectory tells the two apart.
      - run: npm run verify:offline --workspace @driftbox/app

      # What each page costs to open, and the structural half of that: no scene may be in either
      # page's first-load graph. One static import in the registry welds all eighteen back into
      # the entry, and it is a change nobody would see reviewing the diff that caused it.
      - run: npm run check:size --workspace @driftbox/app
